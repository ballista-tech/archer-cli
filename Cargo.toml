[package]
name = "archer-cli"
version = "0.1.0"
edition = "2021"
description = "Archer Protocol CLI — market creation, market making and trading"
publish = true

[lib]
name = "archer_cli"
path = "src/lib.rs"

[[bin]]
name = "archer"
path = "src/main.rs"

[dependencies]
archer-sdk = { git = "https://github.com/ballista-tech/archer-sdk", rev = "0452560a997b6919aa4ea2e6d5606971271b2499", features = ["client"] }

solana-sdk = "2.3.0"
solana-client = "2.3.0"
solana-cli-config = "2.3.0"
solana-account-decoder = "2.3.0"

spl-token = { version = "8.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "6.0.0", features = ["no-entrypoint"] }

borsh = "1.5.7"
bytemuck = { version = "1.24.0", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
serde_json = "1"
anyhow = "1"
bs58 = "0.5"

[profile.release]
overflow-checks = true
