[package]
name = "archer-cli"
version = "0.1.0"
edition = "2021"
description = "Archer Protocol CLI — market creation, market making and trading"
publish = true

[lib]
name = "archer_cli"
path = "src/lib.rs"

[[bin]]
name = "archer"
path = "src/main.rs"

[dependencies]
archer-sdk = { version = "0.5.1", features = ["client"] }

solana-sdk = "4.1.0"
solana-client = "4.3.2"
solana-cli-config = "4.3.2"
solana-account-decoder = "4.3.2"
solana-commitment-config = "3.1.1"
solana-compute-budget-interface = "3.1.0"

spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }

borsh = "1.5.7"
bytemuck = { version = "1.24.0", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
serde_json = "1"
anyhow = "1"
bs58 = "0.5"

[profile.release]
overflow-checks = true
